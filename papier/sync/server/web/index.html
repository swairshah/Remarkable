<!doctype html>
<!-- papier web editor — served at /papier/ on remarkable.exe.xyz.
     A read/WRITE view of the tablet's ~/.local/share/papier/ mirror plus the
     pending web/iPad uploads: draw with the pen, rub out with the eraser,
     add pages, rename, delete — every write lands in the VM's inbound tree
     (POST /papier/api/ink|state|page-add|doc-meta|doc-delete) exactly like
     the iPad app, and the tablet's next pull folds it in. Also a drop-zone
     to add documents. Generalized for the papier document model (folders,
     notebooks + raster books). -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Opt out of dark-mode browser extensions (Dark Reader): they invert the
     document page images/canvas unpredictably. This viewer already ships its
     own light/dark theme, so we render in true colours. -->
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --papier: #fbfbf9; --ink: #1c1c1c; --ai: #2457c5;
    --bg: #ececec; --card: #fff; --line: #d8d8d4; --muted: #6a6a66; --accent: #1c1c1c;
  }
  /* Dark via OS preference only when the site-wide toggle (nav.js,
     <html data-theme>) hasn't made an explicit choice. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --papier:#f4f4f0; --bg:#161615; --card:#212120; --line:#333; --muted:#9a9a94; --accent:#f0f0ea; }
  }
  html[data-theme=dark] { --papier:#f4f4f0; --bg:#161615; --card:#212120; --line:#333; --muted:#9a9a94; --accent:#f0f0ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--accent);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 650; font-size: 18px; letter-spacing: .2px; }
  header .crumb { color: var(--muted); cursor: pointer; }
  header .crumb:hover { color: var(--accent); }
  header .spacer { flex: 1; }
  header .badge { font-size: 12px; color: var(--muted); }
  header .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3aa76d; margin-right:5px; vertical-align:middle; }
  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 60px; }

  /* home grid */
  .section-title { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.10); }
  .thumb { aspect-ratio: 3/4; background: var(--papier); display: grid; place-items: center; border-bottom: 1px solid var(--line); overflow: hidden; }
  .thumb img, .thumb canvas { width: 100%; height: 100%; object-fit: contain; }
  .thumb.folder { background: linear-gradient(160deg, #d9d9d2, #c7c7bf); }
  .thumb.folder svg { width: 46%; opacity: .55; }
  .card .meta { padding: 10px 12px; }
  .card .meta .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta .s { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .card .actions { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .1s; }
  .card { position: relative; }
  .card:hover .actions, .card .actions:focus-within { opacity: 1; }
  /* no hover on touch: the per-card actions have to be visible to be tappable */
  @media (hover: none) { .card .actions { opacity: 1; } }
  .card .actions button { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 7px; width: 26px; height: 26px; font-size: 13px; line-height: 1; cursor: pointer; }

  /* doc reader */
  .pages { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .page { position: relative; width: 100%; max-width: 900px; aspect-ratio: 1404 / 1872; background: var(--papier); box-shadow: 0 2px 14px rgba(0,0,0,.12); border-radius: 4px; overflow: hidden; touch-action: pan-y; }
  /* Finger-draw on: touch must reach the canvas as ink, not as a scroll. */
  body.finger .page { touch-action: none; }
  body.reading.tool-pen .page { cursor: crosshair; }
  body.reading.tool-eraser .page { cursor: cell; }
  body.reading.tool-lasso .page { cursor: crosshair; }
  body.reading.tool-text .page { cursor: text; }
  /* the live text box: a caret on the page, in the page's own font+size */
  .tbox { position: absolute; z-index: 3; border: 0; outline: 0; padding: 0; margin: 0;
          background: rgba(255,255,255,.55); color: #1c1c1c; white-space: pre;
          font-family: 'EB Garamond', Garamond, Georgia, serif; line-height: 1;
          box-shadow: 0 0 0 1px rgba(36,87,197,.55); caret-color: #2457c5; }
  .page canvas, .page img { display: block; width: 100%; height: auto; }
  .page .plabel { position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.7); padding: 1px 7px; border-radius: 9px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 20px; }
  .empty code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }

  /* drop-zone */
  #drop { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,20,.72); color: #fff; display: none; place-items: center; text-align: center; }
  #drop.show { display: grid; }
  #drop .box { border: 3px dashed rgba(255,255,255,.7); border-radius: 16px; padding: 60px 80px; font-size: 22px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--accent); color: var(--card); padding: 10px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .addbtn { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
  .addbtn:hover { border-color: var(--muted); }
  .ai-toggle { cursor: pointer; user-select: none; }
  .docbar { display:flex; align-items:center; gap:10px; margin: 0 auto 14px; max-width:900px; }

  /* doc-view sidebar; shifts content right so it never overlaps. Below the
     breakpoint the sidebar hides and the docbar button is the fallback. */
  .docside { position:fixed; left:18px; top:116px; z-index:6; display:none; flex-direction:column; gap:7px; width:196px; }
  @media (min-width:1000px) {
    body.reading .docbar { display:none; }               /* sidebar is the control */
    body.reading.sidebar .docside { display:flex; }       /* Cmd+B toggles the .sidebar class */
    body.reading.sidebar main { margin-left:230px; }
  }
  @media (min-width:1000px) { body.reading main { margin-right: 66px; } }   /* clear of the tool rail */
  .docside .sect { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin:14px 6px 3px; }
  .docside .sbtn.danger { color:#b4382e; }
  .docside .sbtn.danger:hover { border-color:#b4382e; }
  .docside .save { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); padding:4px 8px; }
  .docside .save .sdot { width:8px; height:8px; border-radius:50%; background:#3aa76d; flex:none; }
  .docside .save.dirty .sdot { background:#e0a324; }
  .docside .save.busy .sdot { background:#2457c5; animation:pulse 1s ease-in-out infinite; }
  .docside .save.err .sdot { background:#b4382e; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* ---- tool rail: the tablet/iPad toolbar, on the web ---- */
  /* Right-edge, floating over the desk exactly like the device toolbar.
     Same control order as the iOS rail: tools | history | pages | add. */
  #rail { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 8;
          display: none; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          box-shadow: 0 6px 26px rgba(0,0,0,.16); }
  body.reading #rail { display: flex; }
  #rail button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 9px;
                 background: transparent; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  #rail button:hover { background: rgba(128,128,128,.14); }
  #rail button.active { background: var(--accent); color: var(--card); }
  #rail button:disabled { opacity: .3; cursor: default; }
  #rail button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #rail .sep { width: 22px; height: 1px; background: var(--line); margin: 4px 0; }
  #rail .pgno { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #rail .emode { position: absolute; right: 2px; bottom: 2px; font-size: 8px; letter-spacing: .04em; }
  #rail button.tool { position: relative; }
  @media (max-width: 620px) { #rail { right: 8px; padding: 4px 2px; } #rail button { width: 34px; height: 34px; } }

  /* ---- generic dialog (rename / move / delete confirm / new notebook) ---- */
  #dlg { position: fixed; inset: 0; z-index: 46; background: rgba(15,15,17,.6); display: none; place-items: center; }
  #dlg.show { display: grid; }
  #dlg .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(460px, calc(100vw - 40px)); padding: 20px; box-shadow: 0 12px 48px rgba(0,0,0,.3); }
  #dlg h3 { margin: 0 0 6px; font-size: 16px; }
  #dlg .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
  #dlg label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #dlg input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--accent); font: inherit; font-size: 14px; padding: 9px 11px; }
  #dlg .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  #dlg .row .danger { background: #b4382e; border-color: #b4382e; color: #fff; }
  .docside .sbtn { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); background:var(--card); color:var(--accent); border-radius:9px; cursor:pointer; font:inherit; font-size:13px; text-align:left; width:100%; }
  .docside .sbtn:hover { border-color:var(--muted); }
  .docside .sbtn.active { background:var(--accent); color:var(--card); border-color:var(--accent); }
  .docside .sbtn .ico { width:16px; text-align:center; opacity:.85; font-size:14px; }
  .docside .sbtn .k { margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  .docside .sbtn.active .k { color:inherit; border-color:currentColor; opacity:.7; }

  /* ---- full PDF.js viewer overlay ---- */
  #pv { position: fixed; inset: 0; z-index: 45; background: var(--bg); display: none; flex-direction: column; }
  #pv.show { display: flex; }
  #pv .pvbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  #pv .pvtitle { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pv iframe { flex: 1; border: 0; width: 100%; }

  /* ---- compose modal + status chip ---- */
  #cmp { position: fixed; inset: 0; z-index: 40; background: rgba(15,15,17,.6); display: none; place-items: center; }
  #cmp.show { display: grid; }
  #cmp .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(560px, calc(100vw - 40px)); padding: 20px; box-shadow: 0 12px 48px rgba(0,0,0,.3); }
  #cmp h3 { margin: 0 0 6px; font-size: 16px; }
  #cmp .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
  #cmp input[type=text], #cmp textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--accent); font: inherit; font-size: 14px; padding: 9px 11px; }
  #cmp textarea { min-height: 150px; resize: vertical; margin-top: 10px; }
  #cmp .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  #cmpchip { position: fixed; right: 18px; bottom: 18px; z-index: 25; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; align-items: center; gap: 9px; max-width: 340px; }
  #cmpchip.show { display: flex; }
  #cmpchip .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: cspin 1s linear infinite; flex: none; }
  @keyframes cspin { to { transform: rotate(360deg); } }

  /* ---- margin editor ---- */
  #med { position: fixed; inset: 0; z-index: 40; background: rgba(15,15,17,.86); display:none; }
  #med.show { display: grid; grid-template-rows: auto 1fr auto; }
  #med .mhead, #med .mfoot { display:flex; align-items:center; gap:14px; padding:12px 18px; color:#e8e8e4; }
  #med .mhead { border-bottom:1px solid rgba(255,255,255,.12); }
  #med .mfoot { border-top:1px solid rgba(255,255,255,.12); flex-wrap:wrap; }
  #med .mtitle { font-weight:600; }
  #med .mspacer { flex:1; }
  #med .mbtn { border:1px solid rgba(255,255,255,.3); background:transparent; color:#e8e8e4; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  #med .mbtn:hover { border-color:#fff; }
  #med .mbtn.primary { background:#f0a020; border-color:#f0a020; color:#1a1a1a; font-weight:600; }
  #med .mbtn:disabled { opacity:.45; cursor:default; }
  #med .mnav { display:flex; align-items:center; gap:10px; color:#cfcfca; font-size:13px; }
  #med .mnav button { width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:transparent; color:#e8e8e4; cursor:pointer; font-size:15px; }
  #med .mnav button:disabled { opacity:.35; cursor:default; }
  #med .mread { color:#cfcfca; font-size:12.5px; font-variant-numeric:tabular-nums; }
  #med .mhint { color:#8a8a86; font-size:12px; margin-left:14px; }
  #med .mstage-wrap { display:grid; place-items:center; overflow:hidden; padding:16px; }
  /* the stage is sized in JS to the SOURCE page's aspect (it shows the whole
     page for a photo-style crop), so no fixed aspect-ratio here */
  #med .mstage { position:relative; background:#fbfbf9; box-shadow:0 4px 30px rgba(0,0,0,.5); touch-action:none; }
  /* Everything (page preview, margin shade, box, handles) is drawn on ONE
     canvas with coordinate hit-testing — no DOM overlays — so dark-mode
     browser extensions (Dark Reader) can't invert the page or paint over the
     box interior. Canvas pixels are left alone. */
  #med .medcanvas { position:absolute; left:0; top:0; touch-action:none; cursor:default; }
  #med .mattach { color:#e8e8e4; text-align:center; place-self:center; max-width:460px; line-height:1.6; }
  #med .mattach .mbtn { margin-top:14px; }
</style>
</head>
<body>
<header>
  <span class="brand" id="brand">Papier</span>
  <span id="crumb"></span>
  <span class="spacer"></span>
  <span class="badge" id="badge"><span class="dot"></span>synced view</span>
  <button class="addbtn" id="compose-btn">✦ Compose</button>
  <button class="addbtn" id="new-nb">+ New notebook</button>
  <button class="addbtn" id="add">+ Add document</button>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<div id="rail"></div>
<input type="file" id="file" multiple hidden>
<div id="drop"><div class="box">Drop files to add them to Papier</div></div>
<div id="dlg"></div>
<div id="med"></div>
<div id="pv"><div class="pvbar"><span class="pvtitle" id="pv-title"></span><span class="spacer"></span><button class="addbtn" id="pv-close">✕ Close</button></div><iframe id="pv-frame" title="PDF viewer"></iframe></div>
<div id="cmp"><div class="box">
  <h3>✦ Compose a document</h3>
  <div class="sub">Paste links and/or describe what you want. An agent on the server researches it, writes a typeset article, and adds the PDF to Papier — it syncs to your tablet like any upload. Takes a few minutes.</div>
  <input type="text" id="cmp-title" placeholder="Title (optional)">
  <textarea id="cmp-instr" placeholder="e.g. https://arxiv.org/abs/2405.12345 — teach me this paper properly, with the math worked through and a running example…"></textarea>
  <div class="row"><button class="addbtn" id="cmp-cancel">Cancel</button><button class="addbtn" id="cmp-go" style="background:var(--accent);color:var(--card)">Create</button></div>
</div></div>
<div id="cmpchip"></div>
<div class="toast" id="toast"></div>

<script>
const DATA = '/papier/data/';
const INBOUND = '/papier/inbound/';   // web-dropped docs pending tablet sync
const UPLOAD = '/papier/upload';
const API = '/papier/api/';           // crop editor: source-status, preview, render, attach
const LIBRARY = API + 'library';
const bust = {};                     // docId -> cache-bust token, bumped after a re-render
const bustq = (id) => bust[id] ? ('?v=' + bust[id]) : '';   // so new pages load, not the cached ones
const PAGE_W = 1404, PAGE_H = 1872, POLL_MS = 60000;
const $ = (id) => document.getElementById(id);
const $view = $('view');
const PERF_START = performance.now();
const paperPerf = window.__paperPerf = {};
function perfMark(name) {
  const ms = Math.round(performance.now() - PERF_START);
  paperPerf[name] = ms;
  document.documentElement.dataset['papier' + name[0].toUpperCase() + name.slice(1) + 'Ms'] = String(ms);
  return ms;
}

const state = {
  folder: null,        // current folder ("" = root, null = not loaded)
  docs: [],            // [{id, meta, mtime}]
  folders: [],         // folder names
  open: null,          // {id, meta, seq, pages:[...]}
  aiBlue: true,
  sig: '',             // doc-set signature for change detection
};

/* ---------- editing state ----------
 * One open document at a time. `models` holds the live ink page files (the
 * same libreink-page JSON the tablet writes); `status` tracks per-page save
 * state and the undo/redo stacks. Everything resets on open/close. */
const AUTOSAVE_MS = 2500;    // matches the tablet's "you paused writing" beat
const RETRY_MS = 6000;
const UNDO_DEPTH = 60;
const ERASE_R = 14;          // eraser nib, page units
const TEXT_SIZE_MIN = 16, TEXT_SIZE_MAX = 120, TEXT_SIZE_STEP = 4;
const edit = {
  tool: 'pen',               // pen | text | eraser | lasso | read
  textSize: 40,              // page units; pi's own runs are 40 too
  erase: 'object',           // object | pixel  (tap the eraser again to cycle)
  fingerDraws: false,        // touch draws instead of scrolling
  models: new Map(),         // inkKey -> live page file
  loading: new Map(),        // inkKey -> Promise<page file>
  status: new Map(),         // inkKey -> {dirty, saving, error, timer, undo, redo, patch}
  current: 0,                // page index nearest the viewport centre
  sel: null,                 // lasso selection: {key, index, poly, strokes:Set, patches:Set}
};

/* ---------- fetch helpers ---------- */
/* `base` selects the mirror (DATA) or the inbound/pending source (INBOUND) */
async function jidxB(base, path) { const r = await fetch(base + path, {cache:'no-store'}); if (!r.ok) throw 0; return r.json(); }
async function jfileB(base, path){ const r = await fetch(base + path, {cache:'no-store'}); if (!r.ok) return null; return r.json(); }
async function jidx(path) { return jidxB(DATA, path); }
async function jfile(path){ return jfileB(DATA, path); }
async function tfile(path){ const r = await fetch(DATA + path, {cache:'no-store'}); if (!r.ok) return null; return r.text(); }
const pad4 = (n) => String(n).padStart(4, '0');
const withVersion = (url, version) => version ? url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : url;
const relDate = (ms) => {
  if (!ms) return '';
  const d = Math.floor((Date.now() - ms) / 86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
};

/* ---------- data model ---------- */
async function loadFrom(base, pending) {
  let idx; try { idx = await jidxB(base, 'docs/'); } catch { idx = []; }
  const dirs = idx.filter(e => e.type === 'directory');
  const docs = [];
  for (const e of dirs) {
    const id = e.name.replace(/\/$/, '');   // autoindex omits the trailing slash
    const meta = await jfileB(base, 'docs/' + id + '/meta.json');
    if (!meta) continue;
    const kind = meta.kind === 'notebook' ? 'notebook' : (meta.pages > 0 ? 'book' : null);
    if (!kind) continue;
    docs.push({ id, base, pending, meta: {...meta, kind}, mtime: Date.parse(e.mtime) || 0 });
  }
  return docs;
}

async function loadDocsLegacy() {
  const mirror = await loadFrom(DATA, false);
  const inbound = await loadFrom(INBOUND, true);
  /* a doc that has made it to the tablet mirror supersedes its pending copy */
  const have = new Set(mirror.map(d => d.id));
  const docs = mirror.concat(inbound.filter(d => !have.has(d.id)));
  const fol = await jfile('folders.json');
  state.folders = (fol && fol.folders) || [];
  for (const d of docs) if (d.meta.folder && !state.folders.includes(d.meta.folder)) state.folders.push(d.meta.folder);
  state.folders.sort();
  docs.sort((a, b) => b.mtime - a.mtime);
  state.docs = docs;
  const sig = docs.map(d => d.id + ':' + d.mtime).join('|') + '#' + state.folders.join(',');
  const changed = sig !== state.sig; state.sig = sig;
  return changed;
}

async function loadDocs() {
  try {
    const r = await fetch(LIBRARY, { cache: 'no-cache' });
    if (!r.ok) throw new Error('library ' + r.status);
    const library = await r.json();
    if (!library || !Array.isArray(library.docs)) throw new Error('bad library');
    state.docs = library.docs;
    state.folders = Array.isArray(library.folders) ? library.folders : [];
    const sig = library.generation || JSON.stringify([state.docs.map(d => [d.id, d.version]), state.folders]);
    const changed = sig !== state.sig; state.sig = sig;
    perfMark('library');
    return changed;
  } catch (err) {
    console.warn('Papier library endpoint unavailable; using legacy index', err);
    return loadDocsLegacy();
  }
}

/* ---------- PDF.js: render books straight from the source PDF ---------- */
/* Books uploaded via the web retain their source PDF on the server (the crop
 * editor uses it). Rendering THAT with PDF.js means one cached download for
 * the whole document instead of a ~150KB PNG + ink round trip per page — and
 * crisp vector text at any zoom/DPR instead of a fixed 1404px raster. */
const PDFJS_VER = '4.8.69';
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/pdf.worker.min.mjs';
let pdfjsPromise = null;
function ensurePdfjs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import(PDFJS_URL).then((m) => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; });
    pdfjsPromise.catch(() => { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}
// Start loading a book's source PDF; resolves null on any failure so the
// viewer falls back to the pre-rendered raster pages.
function startSourcePdf(d) {
  if (d.meta.kind !== 'book' || !d.hasSource) return null;
  const url = API + 'source-pdf?id=' + encodeURIComponent(d.id) + (d.srcVersion ? '&v=' + d.srcVersion : '');
  return ensurePdfjs()
    .then((pdfjs) => pdfjs.getDocument({ url }).promise)
    .catch((err) => { console.warn('source PDF unavailable; using raster pages', err); return null; });
}
// Replicate mkbook.py's placement so PDF.js pages align pixel-for-pixel with
// the tablet raster — ink annotations land exactly where they do on device.
const CROP_BORDER = 30;   // device px, same constant as mkbook.py
function pagePlacement(meta, pw, ph) {
  if (Array.isArray(meta.crop) && meta.crop.length === 4) {
    const [cx0, cy0, cx1, cy1] = meta.crop;
    const cw = (cx1 - cx0) * pw, ch = (cy1 - cy0) * ph;
    const k = Math.min((PAGE_W - 2 * CROP_BORDER) / cw, (PAGE_H - 2 * CROP_BORDER) / ch);
    return { k, ox: (PAGE_W - cw * k) / 2, oy: (PAGE_H - ch * k) / 2, sx: cx0 * pw, sy: cy0 * ph };
  }
  const m = Array.isArray(meta.margins) && meta.margins.length === 4 ? meta.margins : [40, 40, 40, 40];
  const bw = PAGE_W - m[0] - m[2], bh = PAGE_H - m[1] - m[3];
  const k = Math.min(bw / pw, bh / ph);
  return { k, ox: m[0] + (bw - pw * k) / 2, oy: m[1] + (bh - ph * k) / 2, sx: 0, sy: 0 };
}

/* ---------- rendering: shared stroke drawer (papier/notebook JSON) ---------- */
function drawInk(ctx, doc, scale) {
  if (!doc) return;
  ctx.save(); ctx.lineCap = ctx.lineJoin = 'round'; ctx.scale(scale, scale);
  const strokes = [];
  (doc.strokes || []).forEach(s => strokes.push([s, false]));
  (doc.patches || []).forEach(p => (p.strokes || []).forEach(s => strokes.push([s, true])));
  for (const [s, isAI] of strokes) {
    const f = s.p; if (!f || f.length < 3) continue;
    const ai = isAI || s.g > 0;
    ctx.strokeStyle = ctx.fillStyle = (ai && state.aiBlue) ? '#2457c5' : '#1c1c1c';
    if (f.length === 3) { ctx.beginPath(); ctx.arc(f[0]/10, f[1]/10, Math.max(f[2]/10, 1), 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.lineWidth = Math.max((f[2]/10)*2, 1.4);
    ctx.moveTo(f[0]/10, f[1]/10);
    for (let i = 3; i < f.length; i += 3) ctx.lineTo(f[i]/10, f[i+1]/10);
    ctx.stroke();
  }
  /* typeset (Garamond) runs: rendered in the real font, the browser's own
   * high-quality glyphs — pi ink blue, user black. The user's own typed
   * runs are the page's top-level `texts`; pi's live inside its patches. */
  ctx.textBaseline = 'alphabetic';
  const runs = [];
  (doc.texts || []).forEach(t => runs.push([t, false]));
  (doc.patches || []).forEach(p => (p.texts || []).forEach(t => runs.push([t, true])));
  for (const [t, fromPatch] of runs) {
    const ai = fromPatch && t.g > 0;
    ctx.fillStyle = (ai && state.aiBlue) ? '#2457c5' : '#1c1c1c';
    ctx.font = (t.s / 10) + "px 'EB Garamond', Garamond, Georgia, serif";
    ctx.fillText(t.t, t.x / 10, t.y / 10);
  }
  ctx.restore();
}

/* thumbnail: entry 0 at small scale */
async function thumbCanvas(d) {
  const c = document.createElement('canvas');
  const scale = 0.18;
  c.width = Math.round(PAGE_W * scale); c.height = Math.round(PAGE_H * scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fbfbf9'; ctx.fillRect(0, 0, c.width, c.height);
  const st = await jfileB(d.base, 'docs/' + d.id + '/state.json');
  const e0 = st && st.seq && st.seq[0];
  if (d.meta.kind === 'book') {
    const pnum = e0 && e0.p != null ? e0.p : 0;
    const img = await loadImage(d.base + 'docs/' + d.id + '/pages/' + pad4(pnum + 1) + '.png' + bustq(d.id)).catch(()=>null);
    if (img) ctx.drawImage(img, 0, 0, PAGE_W*scale, PAGE_H*scale);
    const ink = await jfileB(d.base, 'docs/' + d.id + '/ink/pdf-' + pad4(pnum + 1) + '.json');
    drawInk(ctx, ink, scale);
  } else {
    const nid = e0 && e0.n != null ? e0.n : 1;
    const ink = await jfileB(d.base, 'docs/' + d.id + '/ink/note-' + pad4(nid) + '.json');
    drawInk(ctx, ink, scale);
  }
  return c;
}

const imageCache = new Map();
const jsonCache = new Map();
function loadImage(url) {
  if (imageCache.has(url)) return imageCache.get(url);
  const pending = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej; img.src = url;
  });
  imageCache.set(url, pending);
  pending.catch(() => imageCache.delete(url));
  return pending;
}
function cachedJson(url) {
  if (!jsonCache.has(url)) {
    jsonCache.set(url, fetch(url).then(r => r.ok ? r.json() : null).catch(() => null));
  }
  return jsonCache.get(url);
}
function inkKey(e) {
  if (e && e.p != null) return 'pdf-' + pad4(e.p + 1);
  if (e && e.n != null) return 'note-' + pad4(e.n);
  return null;
}
function hasInk(d, key) {
  return !Array.isArray(d.ink) || d.ink.includes(key);
}

/* ---------- home view ---------- */
function folderGlyph() {

/* ---------- tool rail ---------- */
/* The device toolbar, on the web: same tools and the same order as the

const RAIL_ICONS = {
  pen: '<svg viewBox="0 0 24 24"><path d="M4.5 19.5l4.2-1.1 9.6-9.6a2.1 2.1 0 0 0-3-3L5.6 15.3z"/><path d="M14.3 5.9l3.8 3.8"/></svg>',

  finger: '<svg viewBox="0 0 24 24"><path d="M9 12.5V5.6a1.5 1.5 0 0 1 3 0v5.3m0-1.1a1.5 1.5 0 0 1 3 0v1.6m0-1a1.5 1.5 0 0 1 3 0V16a5 5 0 0 1-5 5h-1.4a5 5 0 0 1-4.1-2.2l-2.2-3.3a1.6 1.6 0 0 1 2.5-2l1.2 1.4"/></svg>',

  redo: '<svg viewBox="0 0 24 24"><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12h-10a4.5 4.5 0 0 0 0 9H14"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  lasso: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="10" rx="7.5" ry="5.5" stroke-dasharray="3 2.4"/><path d="M8.6 15.1c-1 1.6-.4 3 1 3.4 1.4.3 2-.8 1.2-1.5"/></svg>',
  read: '<svg viewBox="0 0 24 24"><path d="M4 6.5c3-1.4 5.3-1.4 8 0 2.7-1.4 5-1.4 8 0v11c-3-1.4-5.3-1.4-8 0-2.7-1.4-5-1.4-8 0z"/><path d="M12 6.5v11"/></svg>',

};
function buildRail() {
  const rail = $('rail'); rail.innerHTML = '';
  const mk = (html, title, on, cls) => {
    const b = document.createElement('button');
    b.innerHTML = html; b.title = title; b.setAttribute('aria-label', title);
    if (cls) b.className = cls;
    b.onclick = on; rail.appendChild(b); return b;
  };
  const sep = () => { const s = document.createElement('div'); s.className = 'sep'; rail.appendChild(s); };
  rail._pen = mk(RAIL_ICONS.pen, 'Pen (p)', () => setTool('pen'), 'tool');
  rail._text = mk(RAIL_ICONS.text, 'Type (t) — click the page and type; [ and ] size it', () => setTool('text'), 'tool');
  rail._eraser = mk(RAIL_ICONS.eraser, 'Eraser (e) — tap again for object/pixel', () => {
    if (edit.tool === 'eraser') edit.erase = edit.erase === 'object' ? 'pixel' : 'object';
    setTool('eraser');
  }, 'tool');
  rail._lasso = mk(RAIL_ICONS.lasso, 'Lasso (l) — circle ink, then drag it or press ⌫', () => setTool('lasso'), 'tool');
  rail._read = mk(RAIL_ICONS.read, 'Read — pointer draws nothing (r)', () => setTool('read'), 'tool');
  rail._finger = mk(RAIL_ICONS.finger, 'Draw with touch (off = touch scrolls)', () => {

  sep();
  rail._undo = mk(RAIL_ICONS.undo, 'Undo (⌘Z)', () => undo());

  mk(RAIL_ICONS.down, 'Next page', () => scrollToPage(edit.current + 1));

}
function setTool(tool) {

function refreshRail() {

function gotoPagePrompt() {
  if (!state.open) return;
  const n = window.prompt('Go to page (1–' + state.open.seq.length + ')', String(edit.current + 1));
  const i = parseInt(n, 10);
  if (Number.isFinite(i)) scrollToPage(i - 1);
}
function scrollToPage(i) {
  if (!state.open) return;
  const pages = document.querySelectorAll('.page');
  const target = pages[clamp(i, 0, pages.length - 1)];
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// Which page the rail's controls act on: the one covering the viewport centre.
function trackCurrentPage() {
  if (!state.open) return;
  const mid = window.innerHeight / 2;
  let best = edit.current, bestD = Infinity;
  document.querySelectorAll('.page').forEach((p, i) => {
    const r = p.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bestD) { bestD = d; best = i; }

async function openDoc(d) {
  let seq = Array.isArray(d.seq) ? d.seq : null;
  if (!seq) {
    const st = await jfileB(d.base, 'docs/' + d.id + '/state.json');
    seq = (st && st.seq) || [];
  }
  if (state.open) flushAll();   // switching documents must not drop ink
  resetEditing();
  state.open = { ...d, seq, pdfPromise: startSourcePdf(d),
                 /* pages whose freshest ink is the inbound overlay (a web or
                  * iPad write the tablet hasn't folded in yet): those must be
                  * read through the merging API, not the stale static URL */
                 pendingInk: new Set(Array.isArray(d.inkPending) ? d.inkPending : []) };
  buildSidebar(d);
  $('crumb').innerHTML = '  ›  <span class="crumb" id="home-crumb">My files</span>  ›  ' + esc(d.meta.title || d.id);
  const hc = $('home-crumb'); if (hc) hc.onclick = goFiles;

  $view.innerHTML = '';
  if (d.meta.kind === 'book') {
    const bar = document.createElement('div'); bar.className = 'docbar';
    const btn = document.createElement('button'); btn.className = 'addbtn';
    btn.textContent = '⌸  Adjust margins';
    btn.onclick = () => openMarginEditor(d);
    bar.appendChild(btn);
    const pvb = document.createElement('button'); pvb.className = 'addbtn';
    pvb.textContent = '⤡  PDF viewer';
    pvb.onclick = () => openPdfViewer(d);
    bar.appendChild(pvb);
    $view.appendChild(bar);
  }
  renderPages();
  /* warm the ink cache: the library lists exactly which ink files exist, and
   * they are tiny — prefetching them removes one round trip per page later */
  const version = bust[d.id] || d.version;
  (Array.isArray(d.ink) ? d.ink : []).slice(0, 80).forEach((key) => {
    if (!state.open.pendingInk.has(key)) cachedJson(withVersion(d.base + 'docs/' + d.id + '/ink/' + key + '.json', version));
  });
}

/* Build (or rebuild, after a page insert) the page list for the open doc.
 * Lazy render: a big book has hundreds of pages — allocating a full-size
 * canvas for each up front (~10 MB each) freezes the browser. Instead each
 * page is just a sized div; a canvas is created + drawn only when the page
 * nears the viewport, and freed again when it scrolls far away. */
function renderPages() {
  const d = state.open; if (!d) return;
  commitTextBox();
  const seq = d.seq;
  edit.sel = null;             // page indices are about to change

            background: '#fbfbf9',

/* ================= editing =================
 * The web writes the same files the tablet does. A page's ink JSON is
 * loaded once into a live model, edited in place by the pen/eraser, and
 * POSTed back whole to /papier/api/ink — which lands in the VM's inbound
 * overlay, never the mirror, so the tablet's next pull folds it in
 * (per-file last-writer-wins, exactly like the iPad app).
 *

 * through /patch-replace and /patch-erase instead of the whole-page write.

  const maxPatchStroke = patches.reduce((m, q) => Math.max(m, maxId(q.strokes)), 0);
  return {
    v: 1,
    next_patch: Math.max(p.next_patch || 1, patches.reduce((m, q) => Math.max(m, (q.id || 0) + 1), 1)),
    next_stroke: Math.max(p.next_stroke || 1, maxId(strokes) + 1, maxPatchStroke + 1),
    strokes,
    // the user's typed runs — the same encoding as pi's, black by default
    texts: Array.isArray(p.texts) ? p.texts.filter((t) => t && typeof t.t === 'string') : [],
    patches,

/* The live model for one page. Pages the overlay already holds are read

 * static URL — and are copied, because that cache entry is shared. */
function pageInk(d, key) {

  if (edit.loading.has(key)) return edit.loading.get(key);
  const load = (async () => {
    let raw = null;
    const overlay = state.open && state.open.pendingInk && state.open.pendingInk.has(key);
    if (overlay) {
      raw = await fetch(API + 'ink?id=' + encodeURIComponent(d.id) + '&file=' + key + '.json', { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null)).catch(() => null);
    } else if (hasInk(d, key)) {
      const shared = await cachedJson(withVersion(d.base + 'docs/' + d.id + '/ink/' + key + '.json', bust[d.id] || d.version));
      raw = shared ? JSON.parse(JSON.stringify(shared)) : null;
    }
    const model = normalizeInk(raw);
    edit.models.set(key, model);
    edit.loading.delete(key);
    return model;
  })();

function pageStatus(key) {
  if (!edit.status.has(key)) {
    edit.status.set(key, { dirty: false, saving: false, error: null, timer: null, undo: [], redo: [], patch: new Map() });

  edit.current = 0; edit.sel = null;

/* One bitmap of a PDF.js-rendered page, so an erase can repaint what the

/* ---------- lasso: select, drag, delete ---------- */

   * finger travelled, so a scroll that began on the page doesn't leave a
   * caret behind. */

  clearSelection();          // the text layer is about to shift under it
  const existing = index >= 0 ? model.texts[index] : null;
  const size = existing ? (existing.s || 400) / 10 : edit.textSize;
  const x = existing ? existing.x / 10 : pt.x;
  const y = existing ? existing.y / 10 : pt.y;   // baseline
  const scale = page.getBoundingClientRect().width / PAGE_W;   // display px per page unit
  const el = document.createElement('input');
  el.type = 'text'; el.className = 'tbox'; el.value = existing ? existing.t : '';
  el.style.font = runFont(size * scale);
  el.style.left = (x * scale) + 'px';
  el.style.top = ((y - runAscent(size)) * scale) + 'px';
  el.style.height = (size * 1.05 * scale) + 'px';
  el.style.minWidth = (40 * scale) + 'px';
  el.style.width = Math.max(40, (existing ? runWidth(existing) : 0) + 60) * scale + 'px';
  el.spellcheck = false;
  el.addEventListener('input', () => {
    measureCtx.font = runFont(size * scale);
    el.style.width = (measureCtx.measureText(el.value).width + 24 * scale) + 'px';
  });
  el.addEventListener('keydown', (ev) => {
    ev.stopPropagation();   // the page shortcuts must not eat the typing
    if (ev.key === 'Enter') { ev.preventDefault(); commitTextBox(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); cancelTextBox(); }
  });
  el.addEventListener('blur', () => { if (liveBox && liveBox.el === el) commitTextBox(); });
  page.appendChild(el);
  liveBox = { el, page, key, model, index, before: snapshot(model), x, y, size };
  // hide the run being edited so it is not drawn twice
  if (existing) { model.texts = model.texts.filter((_, i) => i !== index); repaintPage(page); }
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
}

function commitTextBox() {
  const box = liveBox;
  if (!box) return;
  liveBox = null;
  const value = box.el.value.replace(/\s+$/, '');
  box.el.remove();
  if (value) {
    box.model.texts.push({ x: Math.round(box.x * 10), y: Math.round(box.y * 10),
                           s: Math.round(box.size * 10), g: 0, t: value });
  }
  repaintPage(box.page);
  // an empty box that created nothing (and edited nothing) is not an edit
  if (!value && box.index < 0) return;
  pushUndo(box.key, box.before, snapshot(box.model));
  markDirty(box.key);
}

function cancelTextBox() {
  const box = liveBox;
  if (!box) return;
  liveBox = null;
  box.el.remove();
  restoreSnapshot(box.model, box.before);   // puts an edited run back untouched
  repaintPage(box.page);
}

/* ---------- erasing ---------- */
/* Object mode drops a whole touched stroke; pixel mode splits it around the
 * nib. Both apply to the user's ink AND to pi's — tablet parity: the user
 * may rub out anything on the page. */
function eraseAt(page, key, model, pt) {
  let user = false;
  const kept = [];
  for (const s of model.strokes) {
    if (!strokeHit(s, pt, ERASE_R)) { kept.push(s); continue; }
    if (edit.erase === 'pixel') {
      const pieces = splitStroke(s, pt, ERASE_R, model);
      if (pieces.length === 1 && pieces[0] === s) { kept.push(s); continue; }
      user = true; kept.push(...pieces);
    } else { user = true; }
  }
  if (user) model.strokes = kept;
  // the user's typed runs erase glyph by glyph, exactly like pi's
  const keptTexts = [];
  for (const run of model.texts) {
    const pieces = eraseGlyphs(run, pt, ERASE_R);
    if (!pieces) { keptTexts.push(run); continue; }
    user = true; keptTexts.push(...pieces);
  }
  model.texts = keptTexts;
  const touched = erasePiInk(model, pt, ERASE_R);
  if (user || touched.size) repaintPage(page);
  touched.forEach((id) => schedulePatchSync(key, id));
  return user;
}

function strokeHit(s, pt, R) {
  const f = s.p; if (!f || f.length < 3) return false;
  if (f.length === 3) return Math.hypot(f[0] / 10 - pt.x, f[1] / 10 - pt.y) <= R + f[2] / 10;
  for (let i = 0; i + 5 < f.length; i += 3) {
    const ax = f[i] / 10, ay = f[i + 1] / 10, bx = f[i + 3] / 10, by = f[i + 4] / 10;
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 ? clamp(((pt.x - ax) * dx + (pt.y - ay) * dy) / len2, 0, 1) : 0;
    const w = Math.max(f[i + 2], f[i + 5]) / 10;
    if (Math.hypot(pt.x - (ax + t * dx), pt.y - (ay + t * dy)) <= R + w) return true;
  }
  return false;
}

// Pixel mode: keep the parts of the stroke the nib missed, as fresh strokes.
function splitStroke(s, pt, R, model) {
  const f = s.p, groups = [];
  let run = [];
  for (let i = 0; i + 2 < f.length; i += 3) {
    if (Math.hypot(f[i] / 10 - pt.x, f[i + 1] / 10 - pt.y) <= R + f[i + 2] / 10) {
      if (run.length) { groups.push(run); run = []; }
    } else { run.push(f[i], f[i + 1], f[i + 2]); }
  }
  if (run.length) groups.push(run);
  if (groups.length === 1 && groups[0].length === f.length) return [s];
  return groups.map((pts, gi) => ({ i: gi === 0 ? s.i : model.next_stroke++, g: s.g || 0, p: pts }));
}

function erasePiInk(model, pt, R) {
  const touched = new Set();
  for (const patch of model.patches) {
    let changed = false;
    const kept = [];
    for (const s of patch.strokes || []) {
      if (!strokeHit(s, pt, R)) { kept.push(s); continue; }
      if (edit.erase === 'pixel') {
        const pieces = splitStroke(s, pt, R, model);
        if (pieces.length === 1 && pieces[0] === s) { kept.push(s); continue; }
        changed = true; kept.push(...pieces);
      } else { changed = true; }
    }
    const texts = [];
    for (const t of patch.texts || []) {
      const pieces = eraseGlyphs(t, pt, R);
      if (!pieces) { texts.push(t); continue; }
      changed = true; texts.push(...pieces);
    }
    if (changed) { patch.strokes = kept; patch.texts = texts; touched.add(patch.id); }
  }
  if (touched.size) model.patches = model.patches.filter((p) => (p.strokes || []).length || (p.texts || []).length);
  return touched;
}

/* Typeset (Garamond) pi runs erase a grapheme at a time and the run splits
 * around the gap — rubbing one word must not delete the sentence. Prefix
 * widths come from the same font the page renders with. */
const measureCtx = document.createElement('canvas').getContext('2d');
function eraseGlyphs(run, pt, R) {
  const text = String(run.t == null ? '' : run.t); if (!text) return null;
  const x = run.x / 10, y = run.y / 10, size = (run.s || 400) / 10;
  if (pt.y < y - size - R || pt.y > y + size * 0.35 + R) return null;
  measureCtx.font = size + "px 'EB Garamond', Garamond, Georgia, serif";
  const chars = Array.from(text);
  const offs = [0];
  let prefix = '';
  for (const ch of chars) { prefix += ch; offs.push(measureCtx.measureText(prefix).width); }
  if (pt.x < x - R || pt.x > x + offs[offs.length - 1] + R) return null;
  const keep = chars.map((_, i) => !(pt.x + R >= x + offs[i] && pt.x - R <= x + offs[i + 1]));
  if (keep.every(Boolean)) return null;
  const out = [];
  let i = 0;
  while (i < chars.length) {
    if (!keep[i]) { i++; continue; }
    const start = i;
    while (i < chars.length && keep[i]) i++;
    const value = chars.slice(start, i).join('');
    if (value.trim()) out.push({ x: Math.round((x + offs[start]) * 10), y: run.y, s: run.s, g: run.g, t: value });
  }
  return out;
}

// pi's ink is the server's: push the rubbed patch back through the partial
// replacement route so concurrent pi writes and other patches survive.
function schedulePatchSync(key, id) {
  const st = pageStatus(key);
  const gen = (st.patch.get(id) || 0) + 1;
  st.patch.set(id, gen);
  setTimeout(async () => {
    const d = state.open;
    if (!d || st.patch.get(id) !== gen) return;
    const model = edit.models.get(key); if (!model) return;
    const patch = model.patches.find((p) => p.id === id);
    const q = 'id=' + encodeURIComponent(d.id) + '&file=' + key + '.json&patch=' + id;
    try {
      const r = patch
        ? await fetch(API + 'patch-replace?' + q, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                   body: JSON.stringify({ patch, next_stroke: model.next_stroke }) })
        : await fetch(API + 'patch-erase?' + q, { method: 'POST' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d.pendingInk.add(key);
    } catch (err) { toast('Could not sync the erased pi ink: ' + err.message, 4000); }
  }, 400);
}

/* ---------- undo / redo ---------- */
/* Snapshots of the user layer — strokes AND typed runs — per page, one
 * entry per gesture. pi patch edits stay out of it: they are already
 * synced to the server. */
const snapshot = (model) => ({ strokes: model.strokes.slice(), texts: model.texts.slice() });
function restoreSnapshot(model, snap) {
  model.strokes = snap.strokes.slice();
  model.texts = snap.texts.slice();
}
function pushUndo(key, before, after) {
  const st = pageStatus(key);
  st.undo.push({ before, after });
  if (st.undo.length > UNDO_DEPTH) st.undo.shift();
  st.redo.length = 0;
  refreshRail();
}
function currentKey() {
  return state.open && state.open.seq[edit.current] ? inkKey(state.open.seq[edit.current]) : null;
}
function applyHistory(dir) {
  const key = currentKey(); if (!key) return;
  const model = edit.models.get(key); if (!model) return;
  const st = pageStatus(key);
  const entry = dir === 'undo' ? st.undo.pop() : st.redo.pop();
  if (!entry) return;
  restoreSnapshot(model, dir === 'undo' ? entry.before : entry.after);
  (dir === 'undo' ? st.redo : st.undo).push(entry);
  const page = document.querySelectorAll('.page')[edit.current];
  if (page) repaintPage(page);
  markDirty(key);
  refreshRail();
}
const undo = () => applyHistory('undo');
const redo = () => applyHistory('redo');

/* ---------- saving ---------- */
function markDirty(key) {
  const st = pageStatus(key);
  st.dirty = true; st.error = null;
  clearTimeout(st.timer);
  st.timer = setTimeout(() => flushPage(key), AUTOSAVE_MS);
  updateSaveChip();
}

/* Writes to one page are serialised: a second POST overlapping the first
 * could otherwise land out of order and persist the older stroke list.
 * The document, page model and status are captured when the flush is
 * QUEUED — closing the document tears the editing state down on the very
 * next tick, and a queued write must still complete. (The model object is
 * mutated in place, so later strokes still ride along.) */
function flushPage(key, doc) {
  const st = pageStatus(key);
  const d = doc || state.open;
  const model = edit.models.get(key);
  st.queue = (st.queue || Promise.resolve()).then(() => writePage(key, d, model, st)).catch(() => {});
  return st.queue;
}

async function writePage(key, d, model, st) {
  if (!st.dirty || !model || !d) return;
  clearTimeout(st.timer); st.timer = null;
  st.dirty = false; st.saving = true;
  updateSaveChip();
  try {
    const r = await fetch(API + 'ink?id=' + encodeURIComponent(d.id) + '&file=' + key + '.json',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(model) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    st.saving = false; st.error = null;
    if (d.pendingInk) d.pendingInk.add(key);   // the overlay is the freshest copy now
    state.sig = '';          // the library moved on; let the next poll rebuild home
  } catch (err) {
    st.saving = false; st.dirty = true; st.error = String(err.message || err);
    clearTimeout(st.timer);
    st.timer = setTimeout(() => flushPage(key, d), RETRY_MS);
  }
  updateSaveChip();
}

async function flushAll(explicit) {
  commitTextBox();          // a caret left open is text the user typed
  const doc = state.open;
  const keys = [...edit.status.keys()].filter((k) => edit.status.get(k).dirty);
  await Promise.all(keys.map((k) => flushPage(k, doc)));
  if (explicit) toast(keys.length ? 'Saved — reaches your tablet on its next sync.' : 'Everything is already saved.', 3000);
}

/* Save state lives in two places: the sidebar chip (wide screens) and the
 * header badge, which is the only one a phone sees. */
function updateSaveChip() {
  let saving = false, dirty = false, error = null;
  edit.status.forEach((st) => {
    if (st.saving) saving = true;
    if (st.dirty) dirty = true;
    if (st.error) error = st.error;
  });
  const mood = error ? 'err' : saving ? 'busy' : dirty ? 'dirty' : 'ok';
  const text = error ? 'Save failed — retrying' : saving ? 'Saving…' : dirty ? 'Unsaved changes' : 'All changes saved';
  const chip = $('savechip');
  if (chip) {
    chip.className = 'save' + (mood === 'ok' ? '' : ' ' + mood);
    chip.querySelector('.stxt').textContent = text;
    chip.title = error || '';
  }
  const badge = $('badge');
  if (badge) {
    const colour = { err: '#b4382e', busy: '#2457c5', dirty: '#e0a324', ok: '#3aa76d' }[mood];
    badge.innerHTML = state.open
      ? '<span class="dot" style="background:' + colour + '"></span>' + esc(text)
      : '<span class="dot"></span>synced view';
    badge.title = state.open ? (error || '') : '';
  }
}

/* ---------- document mutations ---------- */
async function addPage() {
  const d = state.open; if (!d) return;
  await flushAll();
  try {
    const r = await fetch(API + 'page-add?id=' + encodeURIComponent(d.id),
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ after: edit.current }) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    d.seq = j.state.seq;
    d.pendingInk.add(j.key);
    edit.models.set(j.key, normalizeInk(null));
    renderPages();
    edit.current = j.index; refreshRail();
    scrollToPage(j.index);
    state.sig = '';
  } catch (err) { toast('Could not add a page: ' + err.message, 5000); }
}

async function docDetails(d) {
  const res = await dialog({
    title: 'Rename / move',
    sub: 'The new title and folder reach the tablet on its next sync.',
    fields: [{ label: 'Title', value: d.meta.title || d.id },
             { label: 'Folder (blank = My files)', value: d.meta.folder || '', list: state.folders }],
    confirm: 'Save',
  });
  if (!res) return;
  const [title, folder] = res;
  if (!title) { toast('A title is required.'); return; }
  try {
    const r = await fetch(API + 'doc-meta?id=' + encodeURIComponent(d.id),
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, folder }) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    d.meta = { ...d.meta, ...j.meta };
    const listed = state.docs.find((x) => x.id === d.id);
    if (listed) listed.meta = { ...listed.meta, ...j.meta };
    state.sig = '';
    if (state.open && state.open.id === d.id) {
      state.open.meta = d.meta;
      $('crumb').innerHTML = '  ›  <span class="crumb" id="home-crumb">My files</span>  ›  ' + esc(d.meta.title || d.id);
      const hc = $('home-crumb'); if (hc) hc.onclick = goFiles;
    } else { renderHome(); }
    toast('Renamed.', 2500);
  } catch (err) { toast('Rename failed: ' + err.message, 5000); }
}

async function deleteDoc(d) {
  const ok = await dialog({
    title: 'Delete “' + (d.meta.title || d.id) + '”?',
    sub: 'It disappears from the web now and is deleted from the tablet on its next sync. This cannot be undone.',
    confirm: 'Delete', danger: true,
  });
  if (!ok) return;
  try {
    const r = await fetch(API + 'doc-delete?id=' + encodeURIComponent(d.id), { method: 'POST' });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    if (state.open && state.open.id === d.id) {
      resetEditing();            // drop pending writes: they would recreate the doc
      state.open = null;
      $('docside') && $('docside').remove();
      document.body.classList.remove('reading', 'sidebar');
    }
    state.docs = state.docs.filter((x) => x.id !== d.id);
    state.sig = '';
    renderHome();
    toast('Deleted — the tablet drops it on its next sync.', 5000);
  } catch (err) { toast('Delete failed: ' + err.message, 5000); }
}

async function newNotebook() {
  const res = await dialog({ title: 'New notebook', fields: [{ label: 'Title', value: 'Notebook' }], confirm: 'Create' });
  if (!res) return;
  const title = res[0] || 'Notebook';
  try {
    const r = await fetch(API + 'notebook', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    if (state.folder) {
      await fetch(API + 'doc-meta?id=' + encodeURIComponent(j.id),
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder: state.folder }) }).catch(() => {});
    }
    state.sig = '';
    await loadDocs();
    const doc = state.docs.find((x) => x.id === j.id);
    if (doc) openDoc(doc); else renderHome();
  } catch (err) { toast('Could not create the notebook: ' + err.message, 5000); }
}

/* ---------- small modal dialog ---------- */
/* Resolves to the trimmed field values (an empty array when there are no
 * fields), or null when cancelled. */
function dialog({ title, sub, fields = [], confirm = 'OK', danger = false }) {
  return new Promise((resolve) => {
    const el = $('dlg');
    el.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
      fields.map((f, i) =>
        '<label for="dlgf' + i + '">' + esc(f.label) + '</label>' +
        '<input type="text" id="dlgf' + i + '" value="' + esc(f.value || '') + '"' + (f.list ? ' list="dlgl' + i + '"' : '') + '>' +
        (f.list ? '<datalist id="dlgl' + i + '">' + f.list.map((v) => '<option value="' + esc(v) + '">').join('') + '</datalist>' : '')
      ).join('') +
      '<div class="row"><button class="addbtn" id="dlg-cancel">Cancel</button>' +
      '<button class="addbtn' + (danger ? ' danger' : '') + '" id="dlg-ok"' +
      (danger ? '' : ' style="background:var(--accent);color:var(--card)"') + '>' + esc(confirm) + '</button></div></div>';
    el.classList.add('show');
    const values = () => fields.map((f, i) => $('dlgf' + i).value.trim());
    const close = (value) => {
      el.classList.remove('show'); el.innerHTML = ''; el.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      resolve(value);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      else if (e.key === 'Enter') { e.stopPropagation(); close(values()); }
    };
    $('dlg-cancel').onclick = () => close(null);
    $('dlg-ok').onclick = () => close(values());
    el.onclick = (e) => { if (e.target === el) close(null); };
    document.addEventListener('keydown', onKey, true);
    const first = $('dlgf0');
    if (first) { first.focus(); first.select(); }
  });
}

/* ---------- uploads ---------- */
async function upload(files) {
  for (const f of files) {
    toast('Uploading ' + f.name + '…', 4000);
    try {
      const r = await fetch(UPLOAD, { method: 'POST', headers: { 'X-Filename': f.name }, body: f });
      if (!r.ok) throw new Error(await r.text().catch(()=>r.status));
      toast('Added ' + f.name + ' — it will sync to your tablet shortly.', 5000);
    } catch (err) {
      toast('Upload not available yet (' + f.name + ').', 4000);
    }
  }
  setTimeout(refresh, 1500);
}
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 3000); }

/* ---------- compose (agentic doc creation) ---------- */
/* ✦ Compose: instructions/links -> POST /papier/api/compose -> a pi agent on
 * the VM researches + writes + typesets a PDF -> it enters the normal upload
 * path and appears in the library (then on the tablet). The job id lives in
 * localStorage so a reload keeps tracking the run. */
const COMPOSE_KEY = 'papier-compose-job';
let composeTimer = null;
function composeModal(show) { $('cmp').classList.toggle('show', !!show); if (show) $('cmp-instr').focus(); }
function chipShow(text, spinning) {
  const c = $('cmpchip');
  c.innerHTML = (spinning ? '<span class="spin"></span>' : '') + '<span>' + esc(text) + '</span>';
  c.classList.add('show');
}
function chipHide() { $('cmpchip').classList.remove('show'); }
async function submitCompose() {
  const instructions = $('cmp-instr').value.trim();
  const title = $('cmp-title').value.trim();
  if (!instructions) { toast('Describe what to create (or paste links) first.'); return; }
  const btn = $('cmp-go'); btn.disabled = true; btn.textContent = 'Starting…';
  try {
    const r = await fetch(API + 'compose', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instructions, title }) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('compose ' + r.status));
    localStorage.setItem(COMPOSE_KEY, j.job);
    composeModal(false); $('cmp-instr').value = ''; $('cmp-title').value = '';
    watchCompose(j.job);
  } catch (err) { toast('Compose failed to start: ' + err.message, 5000); }
  btn.disabled = false; btn.textContent = 'Create';
}
function watchCompose(job) {
  clearInterval(composeTimer);
  chipShow('Composing…', true);
  const poll = async () => {
    let j = null;
    try {
      const r = await fetch(API + 'compose-status?job=' + encodeURIComponent(job), { cache: 'no-store' });
      j = await r.json().catch(() => null);
      if (r.status === 404) { clearInterval(composeTimer); composeTimer = null; localStorage.removeItem(COMPOSE_KEY); chipHide(); return; }
    } catch (_) { return; }   // transient network error: keep polling
    if (!j) return;
    if (j.status === 'running' || j.status === 'rendering') {
      chipShow((j.title ? j.title + ' — ' : '') + (j.phase || 'working…'), true);
      return;
    }
    clearInterval(composeTimer); composeTimer = null;
    localStorage.removeItem(COMPOSE_KEY);
    if (j.status === 'done') {
      chipHide();
      toast('“' + (j.title || j.docId) + '” is ready — syncing to your tablet.', 8000);
      state.sig = ''; refresh();
    } else {
      chipShow('Compose failed: ' + (j.error || 'unknown error'), false);
      setTimeout(chipHide, 15000);
    }
  };
  poll();
  composeTimer = setInterval(poll, 5000);
}

/* ---------- crop editor ---------- */
/* Photo-crop UX: the stage shows the FULL source page; drag a box around the
 * content to KEEP; everything outside fades. That kept region is what fills
 * the reMarkable screen on render, so cropping a PDF's wasteful margins makes
 * the text BIGGER. The crop lives in page FRACTIONS (0..1) so it applies to
 * every page. Drawn on one canvas (Dark-Reader-proof). */
const MIN_FRAC = 0.08;
const HANDLES = [['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]];
const CURSORS = { nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize', n:'ns-resize', s:'ns-resize', e:'ew-resize', w:'ew-resize', move:'move' };
const med = { id: null, pages: 0, page: 0, crop: null, orig: null, pageImg: null, sw: 0, sh: 0 };

const boxFromCrop = (c) => ({ x: c[0], y: c[1], w: c[2] - c[0], h: c[3] - c[1] });   // [x0,y0,x1,y1] -> box
const cropArray = (b) => [b.x, b.y, b.x + b.w, b.y + b.h].map(v => Math.max(0, Math.min(1, v)));

async function openMarginEditor(d) {
  const el = $('med'); el.className = 'show';
  el.innerHTML = '<div></div><div class="mstage-wrap"><div class="mattach">Loading…</div></div><div></div>';
  let st = null;
  for (let t = 0; t < 3 && !st; t++) {   // retry: the service may be mid-render on a fresh upload
    try { const r = await fetch(API + 'source-status?id=' + encodeURIComponent(d.id), { cache: 'no-store' }); if (r.ok) st = await r.json(); } catch (_) {}
    if (!st) await new Promise(r => setTimeout(r, 500));
  }
  if (!st || !st.ok) { el.querySelector('.mattach').textContent = 'Could not reach the editor service — try again in a moment.'; return; }
  if (!st.hasSource) return renderAttach(d);
  med.id = d.id; med.doc = d; med.pages = st.pages || 1; med.page = 0; med.pageImg = null;
  med.orig = st.orig || [0, 0, 1, 1];
  med.crop = boxFromCrop(st.crop || [0, 0, 1, 1]);
  renderEditor(d);
}

function renderAttach(d) {
  $('med').innerHTML =
    '<div></div><div class="mstage-wrap"><div class="mattach">' +
    '<div class="mtitle" style="font-size:17px;margin-bottom:10px">Crop — “' + esc(d.meta.title || d.id) + '”</div>' +
    'This book was rendered on the desk, so its source PDF isn’t on the server yet. ' +
    'Attach the original PDF once, and you can re-crop it from here anytime.' +
    '<div><input type="file" accept="application/pdf" id="med-file" hidden>' +
    '<button class="mbtn primary" id="med-attach">Attach source PDF</button> ' +
    '<button class="mbtn" id="med-cancel2">Cancel</button></div>' +
    '</div></div><div></div>';
  $('med-attach').onclick = () => $('med-file').click();
  $('med-cancel2').onclick = closeEditor;
  $('med-file').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    toast('Attaching ' + f.name + '…', 4000);
    try {
      const r = await fetch(API + 'attach', { method: 'POST', headers: { 'X-Doc-Id': d.id }, body: f });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'attach failed');
      toast('Attached — opening the editor.', 2500); openMarginEditor(d);
    } catch (err) { toast('Attach failed: ' + err.message, 5000); }
  };
}

function renderEditor(d) {
  $('med').innerHTML =
    '<div class="mhead"><span class="mtitle">Crop — ' + esc(d.meta.title || d.id) + '</span>' +
      '<span class="mspacer"></span>' +
      '<div class="mnav"><button id="med-prev">‹</button><span id="med-pg"></span><button id="med-next">›</button></div></div>' +
    '<div class="mstage-wrap"><div class="mstage" id="med-stage"><canvas class="medcanvas" id="med-canvas"></canvas></div></div>' +
    '<div class="mfoot"><span class="mread" id="med-read"></span>' +
      '<span class="mhint">drag the box around what to keep — the faded part is cropped away</span>' +
      '<span class="mspacer"></span>' +
      '<button class="mbtn" id="med-reset">Reset to original</button>' +
      '<button class="mbtn" id="med-cancel">Cancel</button>' +
      '<button class="mbtn primary" id="med-save">Save &amp; push</button></div>';
  $('med-prev').onclick = () => gotoPage(med.page - 1);
  $('med-next').onclick = () => gotoPage(med.page + 1);
  $('med-cancel').onclick = closeEditor;
  $('med-reset').onclick = () => { med.crop = boxFromCrop(med.orig); layoutBox(); };
  $('med-save').onclick = saveCrop;
  setupBoxDrag();
  gotoPage(0);
}

function gotoPage(p) {
  med.page = clamp(p, 0, med.pages - 1);
  $('med-pg').textContent = 'page ' + (med.page + 1) + ' / ' + med.pages;
  $('med-prev').disabled = med.page === 0;
  $('med-next').disabled = med.page === med.pages - 1;
  const want = med.page;
  const im = new Image();
  im.onload = () => { if (med.page === want) { med.pageImg = im; sizeStage(im.naturalWidth, im.naturalHeight); layoutBox(); } };
  im.src = API + 'preview?id=' + encodeURIComponent(med.id) + '&page=' + med.page;
  if (med.pageImg) layoutBox();   // keep the last page visible until the new one loads
  if (med.page + 1 < med.pages) { const nx = new Image(); nx.src = API + 'preview?id=' + encodeURIComponent(med.id) + '&page=' + (med.page + 1); }
}

// size the stage to the SOURCE page's aspect, as big as fits the viewport
function sizeStage(iw, ih) {
  const stage = $('med-stage'); if (!stage) return;
  const A = iw / ih, maxH = window.innerHeight * 0.80, maxW = window.innerWidth - 56;
  let h = maxH, w = h * A; if (w > maxW) { w = maxW; h = w / A; }
  stage.style.width = Math.round(w) + 'px'; stage.style.height = Math.round(h) + 'px';
}

/* draw the full source page, fade everything outside the crop, then the box +
 * handles — all on one canvas so Dark Reader can't touch it. */
function layoutBox() {
  const stage = $('med-stage'), cv = $('med-canvas'); if (!stage || !cv) return;
  const r = stage.getBoundingClientRect(), W = r.width, H = r.height;
  med.sw = W; med.sh = H;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fbfbf9'; ctx.fillRect(0, 0, W, H);
  if (med.pageImg) ctx.drawImage(med.pageImg, 0, 0, W, H);   // whole source page fills the stage
  const b = med.crop, bx = b.x * W, by = b.y * H, bw = b.w * W, bh = b.h * H;
  ctx.fillStyle = 'rgba(12,12,15,0.60)';   // fade what gets cropped away
  ctx.fillRect(0, 0, W, by); ctx.fillRect(0, by + bh, W, H - (by + bh));
  ctx.fillRect(0, by, bx, bh); ctx.fillRect(bx + bw, by, W - (bx + bw), bh);
  ctx.strokeStyle = '#f0a020'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
  for (const [, fx, fy] of HANDLES) {
    ctx.beginPath(); ctx.arc(bx + fx * bw, by + fy * bh, 6, 0, 7);
    ctx.fillStyle = '#f0a020'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  $('med-read').textContent = 'keeping ' + Math.round(b.w * 100) + '% × ' + Math.round(b.h * 100) + '% of the page';
}

const toStage = (e) => { const r = $('med-stage').getBoundingClientRect(); return { sx: e.clientX - r.left, sy: e.clientY - r.top }; };
function hitTest(sx, sy) {   // in stage pixels
  const b = med.crop, W = med.sw, H = med.sh, R = 22;
  for (const [name, fx, fy] of HANDLES) {
    if (Math.abs(sx - (b.x + fx * b.w) * W) <= R && Math.abs(sy - (b.y + fy * b.h) * H) <= R) return name;
  }
  return (sx >= b.x * W && sx <= (b.x + b.w) * W && sy >= b.y * H && sy <= (b.y + b.h) * H) ? 'move' : null;
}

function setupBoxDrag() {
  const cv = $('med-canvas');
  let mode = null, start = null, sp = null;
  const move = (e) => {
    const { sx, sy } = toStage(e);
    const dx = (sx - sp.sx) / med.sw, dy = (sy - sp.sy) / med.sh;   // fraction deltas
    let { x, y, w, h } = start;
    if (mode === 'move') {
      x = clamp(start.x + dx, 0, 1 - w); y = clamp(start.y + dy, 0, 1 - h);
    } else {
      if (mode.includes('w')) { const nx = clamp(start.x + dx, 0, start.x + start.w - MIN_FRAC); w = start.w + (start.x - nx); x = nx; }
      if (mode.includes('e')) { w = clamp(start.w + dx, MIN_FRAC, 1 - start.x); }
      if (mode.includes('n')) { const ny = clamp(start.y + dy, 0, start.y + start.h - MIN_FRAC); h = start.h + (start.y - ny); y = ny; }
      if (mode.includes('s')) { h = clamp(start.h + dy, MIN_FRAC, 1 - start.y); }
    }
    med.crop = { x, y, w, h }; layoutBox();
  };
  const end = () => { window.removeEventListener('pointermove', move); mode = null; };
  cv.addEventListener('pointerdown', (e) => {
    const { sx, sy } = toStage(e); const m = hitTest(sx, sy);
    if (!m) return;
    e.preventDefault(); mode = m; start = { ...med.crop }; sp = { sx, sy };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end, { once: true });
  });
  cv.addEventListener('pointermove', (e) => {   // hover cursor
    if (mode) return;
    const { sx, sy } = toStage(e); const m = hitTest(sx, sy);
    cv.style.cursor = m ? CURSORS[m] : 'default';
  });
}

async function saveCrop() {
  const c = cropArray(med.crop);
  const d = med.doc, id = med.id;
  const btn = $('med-save'); btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const r = await fetch(API + 'render-job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, crop: c }) });
    const j = await r.json(); if (!j.ok || !j.job) throw new Error(j.error || 'render failed');
    const deadline = Date.now() + 300000;
    while (Date.now() < deadline) {
      const sr = await fetch(API + 'render-status?job=' + encodeURIComponent(j.job), { cache: 'no-store' });
      const status = await sr.json();
      if (!sr.ok || !status.ok) throw new Error(status.error || 'render status failed');
      if (status.status === 'failed') throw new Error(status.error || 'render failed');
      if (status.status === 'done') break;
      btn.textContent = status.total && status.page
        ? `Rendering ${status.page} / ${status.total}…`
        : 'Preparing render…';
      await new Promise(resolve => setTimeout(resolve, 750));
    }
    if (Date.now() >= deadline) throw new Error('render timed out');
    bust[id] = Date.now();          // force the viewer to load the NEW pages, not the cached ones
    closeEditor();
    toast('Cropped & re-rendered — reaches your tablet on the next sync (~90s).', 6000);
    if (d) openDoc(d); else setTimeout(refresh, 1000);   // re-open so you see the new pages now
  } catch (err) { toast('Render failed: ' + err.message, 5000); btn.disabled = false; btn.innerHTML = 'Save &amp; push'; }
}

function closeEditor() { const el = $('med'); el.className = ''; el.innerHTML = ''; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
window.addEventListener('resize', () => { if ($('med').classList.contains('show') && med.pageImg && $('med-stage')) { sizeStage(med.pageImg.naturalWidth, med.pageImg.naturalHeight); layoutBox(); } });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (liveBox) { cancelTextBox(); return; }                        // the caret first
    if ($('pv').classList.contains('show')) closePdfViewer();       // PDF viewer overlay first
    else if ($('cmp').classList.contains('show')) composeModal(false);
    else if ($('med').classList.contains('show')) closeEditor();    // then the crop editor
    else if (edit.sel) clearSelection();                             // then a lasso selection
    else if (state.open) goFiles();                                  // then: back to My files
    return;
  }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'b' || e.key === 'B')) {   // Cmd/Ctrl+B: toggle the sidebar
    if (state.open) { e.preventDefault(); toggleSidebar(); }
    return;
  }
  if (!state.open) return;
  if (/^(?:INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) return;
  if (e.metaKey || e.ctrlKey) {
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); flushAll(true); }
    else if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y') { e.preventDefault(); redo(); }
    return;
  }
  if (e.altKey) return;
  if (e.key === 'Backspace' || e.key === 'Delete') {
    if (edit.sel) { e.preventDefault(); deleteSelection(); }
    return;
  }
  if (e.key === '[' || e.key === ']') {
    edit.textSize = clamp(edit.textSize + (e.key === ']' ? TEXT_SIZE_STEP : -TEXT_SIZE_STEP),
                          TEXT_SIZE_MIN, TEXT_SIZE_MAX);
    setTool('text');
    return;
  }
  if (e.key === 'p') setTool('pen');
  else if (e.key === 't') setTool('text');
  else if (e.key === 'e') { if (edit.tool === 'eraser') edit.erase = edit.erase === 'object' ? 'pixel' : 'object'; setTool('eraser'); }
  else if (e.key === 'l') setTool('lasso');
  else if (e.key === 'r') setTool('read');
  else if (e.key === 'PageDown' || e.key === 'ArrowRight') { e.preventDefault(); scrollToPage(edit.current + 1); }
  else if (e.key === 'PageUp' || e.key === 'ArrowLeft') { e.preventDefault(); scrollToPage(edit.current - 1); }
});

/* Never lose ink to a tab close: the beacon survives unload, and only when
 * the browser refuses it do we hold the page open with a warning. */
window.addEventListener('beforeunload', (e) => {
  const d = state.open; if (!d) return;
  let stuck = false;
  edit.status.forEach((st, key) => {
    if (!st.dirty) return;
    const model = edit.models.get(key);
    let sent = false;
    try {
      sent = !!(model && navigator.sendBeacon &&
        navigator.sendBeacon(API + 'ink?id=' + encodeURIComponent(d.id) + '&file=' + key + '.json',
          new Blob([JSON.stringify(model)], { type: 'application/json' })));
    } catch (_) { sent = false; }
    if (sent) st.dirty = false; else stuck = true;
  });
  if (stuck) { e.preventDefault(); e.returnValue = ''; }
});

// Which page the rail acts on follows the scroll.
let scrollTick = false;
window.addEventListener('scroll', () => {
  if (scrollTick || !state.open) return;
  scrollTick = true;
  requestAnimationFrame(() => { scrollTick = false; trackCurrentPage(); });
}, { passive: true });

/* ---------- poll / boot ---------- */
let refreshBusy = false;
async function refresh() {
  if (state.open || document.hidden || refreshBusy) return;
  refreshBusy = true;
  try {
    const changed = await loadDocs();
    if (changed || $view.querySelector('.empty')) renderHome();
  } finally { refreshBusy = false; }
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('brand').onclick = () => { if (state.open) goFiles(); else { state.folder = null; renderHome(); } };
$('add').onclick = () => $('file').click();
$('new-nb').onclick = newNotebook;
$('compose-btn').onclick = () => composeModal(true);
$('cmp-cancel').onclick = () => composeModal(false);
$('cmp-go').onclick = submitCompose;
$('cmp').addEventListener('click', (e) => { if (e.target.id === 'cmp') composeModal(false); });
$('pv-close').onclick = closePdfViewer;
$('file').onchange = (e) => upload(e.target.files);
let dragN = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); if (dragN++ === 0) $('drop').classList.add('show'); });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').classList.remove('show'); } });
window.addEventListener('drop', (e) => { e.preventDefault(); dragN = 0; $('drop').classList.remove('show'); if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushAll(); return; }   // leaving the tab saves what's pending
  if (!state.open) refresh();
});

(async function boot() {
  const pendingCompose = localStorage.getItem(COMPOSE_KEY);
  if (pendingCompose) watchCompose(pendingCompose);
  await loadDocs();
  renderHome();
  perfMark('ready');
  console.info('Papier ready', paperPerf);
  setInterval(refresh, POLL_MS);
})();
</script>
</body>
</html>
