[package]
name = "papier-gpui"
version = "0.1.0"
edition = "2024"
description = "Papier for the Framework laptop: the reMarkable/iPad papier UX on a pen touchscreen, in GPUI."

[[bin]]
name = "papier"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "5"
evdev = "0.13.2"
futures = "0.3"
gpui = "0.2.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ureq = { version = "2", default-features = false }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

# xattr 0.2.3 references libc::ENOATTR on Linux, where ENODATA is the
# equivalent constant. Keep this patch until GPUI's tar dependency is updated.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# GPUI's `Window::dispatch_event` is public but returns a pub(crate) type,
# so it can't be called from outside the crate. We need it to turn raw
# touch/pen taps into real GPUI clicks (GPUI has no Wayland touch input).
# The only change from gpui 0.2.2 is that one struct's visibility.
gpui = { path = "vendor/gpui" }
