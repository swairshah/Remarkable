[package]
name = "bb-ink"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libreink-core = { path = "../../libreink/crates/libreink-core" }
libreink-svg = { path = "../../libreink/crates/libreink-svg" }
libreink-text = { path = "../../libreink/crates/libreink-text" }
roxmltree = "0.21.1"
fontdue = "0.9.3"
libreink-hershey = { version = "0.1.0", path = "../../libreink/crates/libreink-hershey" }

[target.'cfg(target_os = "linux")'.dependencies]
libreink-display = { path = "../../libreink/crates/libreink-display" }
libreink-input = { path = "../../libreink/crates/libreink-input" }

[profile.release]
strip = true
lto = true
opt-level = "s"
